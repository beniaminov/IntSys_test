<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ВКР</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;900&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 18px;
    background: #967544;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    box-sizing: border-box;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .card {
    background: #fff;
    border: 4px solid #000;
    padding: 30px 40px;
    box-sizing: border-box;
  }

  .row {
    display: flex;
    gap: 20px;
    padding: 12px 0;
    align-items: baseline;
  }

  .row + .row {
    border-top: 2px solid #b0b0b0;
  }

  .label {
    font-weight: 900;
    min-width: 220px;
    flex-shrink: 0;
  }

  .gif {
    border: 4px solid #000;
    box-sizing: border-box;
  }

  .gif img {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="row"><span class="label">Имя</span><span>Пиянзин Валерий</span></div>
      <div class="row"><span class="label">Email</span><span>privacyfirst@doesntmatter.com</span></div>
      <div class="row"><span class="label">Тема ВКР</span><span>Разработка среды для реализации приемов потенциальной поэзии и динамической организации формальных ограничений</span></div>
      <div class="row"><span class="label">Научный руководитель</span><span>Аншаков Олег Михайлович</span></div>
    </div>

    <div class="gif">
      <img src="Z00.gif" alt="Z00" id="gifImg">
    </div>
  </div>

<script>
  const card = document.getElementById('card');
  const gifImg = document.getElementById('gifImg');

  function fitCardToGif() {
    card.style.paddingTop = '30px';
    card.style.paddingBottom = '30px';

    const gifHeight = gifImg.getBoundingClientRect().height + 8;
    const cardHeight = card.getBoundingClientRect().height;

    const diff = gifHeight - cardHeight;
    const half = diff / 2;

    const newTop = Math.max(0, 30 + half);
    const newBottom = Math.max(0, 30 + half);

    card.style.paddingTop = newTop + 'px';
    card.style.paddingBottom = newBottom + 'px';
  }

  if (gifImg.complete) {
    fitCardToGif();
  } else {
    gifImg.addEventListener('load', fitCardToGif);
  }
  window.addEventListener('resize', fitCardToGif);
</script>
</body>
</html>
